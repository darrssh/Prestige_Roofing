# Deploy the Astro static site to GitHub Pages.
#
# Setup (one time, in the GitHub repo):
#   1. Settings → Pages → Source: "GitHub Actions".
#   2. Push to the default branch (or run manually from the Actions tab).
#
# Configuration:
#   - PUBLIC_SITE_URL / PUBLIC_BASE_PATH env defaults live in astro.config.mjs
#     and .env.example. For a custom domain, set repository Variables
#     (Settings → Secrets and variables → Actions → Variables):
#       PUBLIC_SITE_URL=https://prestigeroofingsolutions.com.au
#       PUBLIC_BASE_PATH=/
#     and add a CNAME file / DNS records. See README for details.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH }}

      - name: Check internal links
        run: npm run audit:links

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
